<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>字节分析</title><script src="vendor/vue.global.prod.js"></script><style>body{margin:0;font:14px system-ui;background:#f4f3fa;color:#292735}main{padding:24px}header{display:flex;align-items:center;gap:18px}h1{font-size:20px;flex:1}button{padding:10px 16px;border:0;border-radius:7px;background:#7054d8;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}textarea{width:100%;height:360px;box-sizing:border-box;font:15px Consolas,monospace;padding:12px;border:1px solid #ddd7e9;border-radius:9px}.bins{display:flex;align-items:end;gap:5px;height:250px;overflow:auto;background:#211f2c;padding:20px;border-radius:9px}.bar{background:#a994ff;min-width:12px;color:white;font-size:10px;text-align:center;writing-mode:vertical-rl}strong{font-size:40px;display:block}small{color:#6c687c}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><main id="app"><header><h1>UTF-8 字节分析</h1><button @click="run">计算分布</button></header><div class="grid"><textarea v-model="content" aria-label="输入文本"></textarea><section><strong>{{count}}</strong><small>UTF-8 字节</small><div class="bins"><div class="bar" v-for="bin in bins" :style="{height:Math.max(14,bin.count*20)+'px'}">{{bin.byte.toString(16).padStart(2,'0')}}</div></div></section></div><p role="status">{{message}}</p></main><script type="module" src="app.js"></script></html>
