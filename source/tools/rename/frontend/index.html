<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>rename</title><link rel="stylesheet" href="base.css"><body><main><div class="split"><aside class="settings"><h1>命名规则</h1><p>先预览，再确认更名。</p><label>文件名前缀<input id="prefix"></label><label>文件名后缀<input id="suffix"></label><label class="check"><input type="checkbox" id="numbering">添加序号</label><label>起始序号<input id="start" type="number" min="0" max="999999999" value="1"></label><label>序号位数<input id="digits" type="number" min="1" max="12" value="3"></label><button id="preview" data-action class="primary">生成预览</button></aside><section><div class="toolbar"><h2>文件与命名对照</h2><span class="spacer"></span><button id="add">添加文件</button><button id="clear">清空</button></div><div id="files" class="empty">添加文件后可调整顺序</div><div class="toolbar"><button id="apply" data-action class="primary" disabled>确认更名</button><button id="undo" data-action>撤销最近批次</button><button id="recover" data-action>恢复中断</button><button id="cancel" disabled>取消</button></div><div id="status" class="status" role="status"></div><div id="results" class="scroll"></div></section></div></main><script type="module" src="tool.js"></script></body></html>
