<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>file-hash</title><link rel="stylesheet" href="base.css"><body><main><div class="toolbar"><div><h1>文件校验</h1><small>流式读取 · 保留原文件</small></div><span class="spacer"></span><select id="algorithm" aria-label="校验算法" style="width:140px"><option>SHA-256</option><option>SHA-512</option></select><button id="add">添加文件</button><button id="calculate" data-action class="primary">计算校验值</button><button id="cancel" disabled>取消</button></div><div id="status" class="status" role="status">选择文件后计算校验值</div><div id="files" class="empty">支持任意普通文件</div><div class="toolbar"><label style="flex:1">预期校验值（仅对第一项结果比对）<input id="expected" placeholder="粘贴 SHA 校验值"></label><button id="compare">比对</button><button id="copy">复制结果</button><button id="save">导出结果</button></div><output id="comparison"></output><div id="results" class="scroll"></div></main><script type="module" src="tool.js"></script></body></html>
