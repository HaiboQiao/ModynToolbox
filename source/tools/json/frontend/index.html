<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>json</title><link rel="stylesheet" href="base.css"><body><main id="app"><div class="toolbar"><div><h1>JSON 编辑器</h1><small>格式化与校验 · 保留数字精度</small></div><span class="spacer"></span><button @click="load" :disabled="busy">载入文件</button><button @click="run('validate')" :disabled="busy">检查 JSON</button><button class="primary" @click="run('format')" :disabled="busy">格式化</button><button @click="cancel" :disabled="!busy">取消</button></div><div class="editors"><section><div class="editor-heading"><label for="input">输入</label><span>{{text.length}} 字符</span><button @click="text=''" :disabled="busy">清空</button></div><textarea id="input" v-model="text" :readonly="busy" spellcheck="false" placeholder="粘贴 JSON 内容，或载入 UTF-8 文件"></textarea></section><section><div class="editor-heading"><label for="output">结果</label><button @click="copy">复制</button><button @click="save">导出</button></div><textarea id="output" :value="output" readonly spellcheck="false" placeholder="格式化结果会显示在这里"></textarea></section></div><div class="status" :class="{error:failed}" role="status">{{message}}</div></main><script src="vendor/vue.global.prod.js"></script><script type="module" src="tool.js"></script></body></html>
