<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>image</title><link rel="stylesheet" href="base.css"><body><main><div class="toolbar"><div><h1>图片处理</h1><small>JPEG / PNG / WebP · 单图最多 50 MiB / 4000 万像素</small></div><span class="spacer"></span><button id="add">添加图片</button></div><div class="image-workspace"><section><div class="previews"><figure><img id="before" alt="原图预览"><figcaption>原图</figcaption></figure><figure><img id="after" alt="处理后预览"><figcaption>处理结果</figcaption></figure></div><div id="files" class="empty">添加图片后显示预览</div></section><aside class="settings"><h2>输出设置</h2><label>格式<select id="format"><option>WebP</option><option>JPEG</option><option>PNG</option></select></label><label>质量 <output id="qvalue">80</output><input id="quality" type="range" min="1" max="100" value="80"></label><label>最长边（0 保持尺寸）<input id="longest_edge" type="number" min="0" max="100000" value="0"></label><label>输出目录<input id="output_dir" placeholder="空：使用工具导出目录"></label><button id="directory">选择目录</button><p>PNG 使用无损压缩；透明图转 JPEG 使用白底。</p><div class="toolbar"><button id="compress" data-action class="primary">开始处理</button><button id="cancel" disabled>取消</button></div><progress id="progress" value="0" max="1"></progress></aside></div><div id="status" class="status" role="status"></div><div id="results" class="scroll"></div></main><script type="module" src="tool.js"></script></body></html>
