<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文本翻译</title><link rel="stylesheet" href="style.css"><body><main>
<header><div><h1>文本翻译</h1><p id="engineLabel">公共在线 · MyMemory · 中英互译</p></div><button id="serviceToggle" aria-expanded="false" aria-controls="service">服务设置</button></header>
<section class="languages"><label>原文语言<select id="source"><option value="auto">自动判断中 / 英</option><option value="zh">中文</option><option value="en">English</option></select></label><button id="swap" title="交换语言；有译文时作为新原文" aria-label="交换语言">⇄</button><label>目标语言<select id="target"><option value="auto">自动互译</option><option value="zh">中文</option><option value="en">English</option></select></label></section>
<section id="service" hidden><label>翻译服务<select id="provider"><option value="mymemory">公共在线 · MyMemory</option><option value="libretranslate">自建 / 私有 · LibreTranslate</option></select></label><label id="endpointField" hidden>服务地址<input id="endpoint" value="http://127.0.0.1:5000" spellcheck="false" placeholder="https://your-service.example"></label><small>公共服务有用量限制；自建服务需安装对应中英模型。需要 API Key 的服务从本机用户环境变量 MODYN_TRANSLATE_API_KEY 读取，密钥不写入会话。</small></section>
<div class="editors"><section><div class="heading"><label for="input">原文 <span id="count">0 / 8000</span></label><button id="clear">清空</button></div><textarea id="input" maxlength="8000" placeholder="输入或粘贴中文 / English，Ctrl + Enter 翻译" spellcheck="false"></textarea></section><section><div class="heading"><label for="output">译文 <span id="outputHint"></span></label><button id="copy" disabled>复制</button><button id="export" disabled>导出</button></div><textarea id="output" readonly placeholder="译文将显示在这里" spellcheck="false"></textarea></section></div>
<footer><span id="privacy">点击翻译才向所选服务发送原文；敏感内容请选择自己的服务。</span><div><button id="cancel" disabled>取消</button><button id="translate" class="primary">翻译</button></div></footer><div id="status" role="status" aria-live="polite">就绪</div></main><script type="module" src="tool.js"></script></body></html>
