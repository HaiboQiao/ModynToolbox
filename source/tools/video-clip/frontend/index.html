<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>video-clip</title><link rel="stylesheet" href="base.css"><body><main><div class="toolbar"><div><h1>视频裁剪</h1><small>选择片段，另存为新视频；原文件保持不变</small></div><span class="spacer"></span><button id="add">打开视频</button></div><div class="video-layout"><section><div class="player"><video id="player" controls preload="metadata"></video><p id="empty">打开本地视频，开始选择片段</p></div><div class="toolbar"><button id="mark-in">当前位置设为起点</button><button id="mark-out">当前位置设为终点</button><span class="spacer"></span><span id="duration" class="muted"></span></div><div class="timeline"><label>起点（秒）<input id="start_s" type="number" min="0" step="0.001" value="0"></label><input id="in-range" aria-label="裁剪起点" type="range" min="0" max="100" step="0.001" value="0"><label>终点（秒）<input id="end_s" type="number" min="0" step="0.001" value="0"></label><input id="out-range" aria-label="裁剪终点" type="range" min="0" max="100" step="0.001" value="100"></div><div id="status" class="status" role="status"></div><div id="results" class="scroll"></div></section><aside class="settings"><h2>导出</h2><label>方式<select id="mode"><option>精确裁剪</option><option>快速截取</option></select></label><label>画质<select id="quality"><option>较高画质</option><option>均衡</option><option>较小文件</option></select></label><label>尺寸<select id="size"><option>原尺寸</option><option>最长边1920</option><option>最长边1280</option></select></label><label>音轨<select id="audio_index"><option value="-1">自动选择</option></select></label><label class="check"><input id="remove_audio" type="checkbox">移除音频</label><label>文件名<input id="filename" placeholder="空：自动命名"></label><label>输出目录<input id="output_dir" placeholder="空：源目录下 Exports"></label><button id="directory">选择目录</button><p>快速截取需要先准备并确认实际区间。浏览器不支持预览的格式仍可分析，不能预览时会给出提示。</p><div class="toolbar"><button id="prepare" data-action>准备区间</button><button id="export" data-action class="primary">导出片段</button><button id="cancel" disabled>取消</button></div><progress id="progress" value="0" max="1"></progress></aside></div></main><script type="module" src="tool.js"></script></body></html>
