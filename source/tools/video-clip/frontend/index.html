<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频裁剪</title><link rel="stylesheet" href="base.css"><body><main class="clip-app">
<header class="clip-header"><div><h1>视频裁剪</h1><small>拖动两端选择片段，蓝色竖线定位播放位置</small></div><div class="header-actions"><button id="settings-toggle" aria-controls="export-settings" aria-expanded="false">导出设置</button><button id="add" class="import">＋ 添加视频</button></div></header>
<div class="video-layout"><section class="stage"><div class="player"><video id="player" controls preload="metadata"></video><div id="empty"><strong>添加视频，开始剪辑</strong><span>拖入本地视频，或点击右上角「添加视频」</span></div></div>
<section class="clip-selection" aria-label="片段选择"><div class="selection-heading"><strong>片段选择</strong><span id="selection-duration" class="duration-chip">尚未选择视频</span><span class="spacer"></span><button id="mark-in" title="将当前播放位置设置为起点">设为起点</button><button id="mark-out" title="将当前播放位置设置为终点">设为终点</button></div>
<div id="trim-track" class="trim-track"><div class="track-base"></div><div id="selected-band"></div><input id="in-range" aria-label="裁剪起点" type="range" min="0" max="100" step="0.001" value="0"><input id="out-range" aria-label="裁剪终点" type="range" min="0" max="100" step="0.001" value="100"><button id="playhead" role="slider" aria-label="播放位置" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" title="拖动竖线定位播放位置"></button></div>
<div class="time-fields"><label for="start_s">起点 <input id="start_s" type="number" min="0" step="0.001" value="0"><span>秒</span></label><label for="end_s">终点 <input id="end_s" type="number" min="0" step="0.001" value="0"><span>秒</span></label><span id="duration" class="muted"></span></div></section>
<details id="output-panel" hidden><summary>输出结果</summary><div id="results" class="scroll"></div></details></section>
<aside id="export-settings" class="settings" aria-label="导出设置"><h2>导出设置</h2><label>方式<select id="mode"><option>精确裁剪</option><option>快速截取</option></select></label><label>画质<select id="quality"><option>较高画质</option><option>均衡</option><option>较小文件</option></select></label><label>尺寸<select id="size"><option>原尺寸</option><option>最长边1920</option><option>最长边1280</option></select></label><label>音轨<select id="audio_index"><option value="-1">自动选择</option></select></label><label class="check"><input id="remove_audio" type="checkbox">移除音频</label><details class="output-options"><summary>输出位置与文件名</summary><label>文件名<input id="filename" placeholder="自动命名"></label><label>目录<input id="output_dir" placeholder="源目录下 Exports"></label><button id="directory">选择目录</button></details><small>原视频保持不变。快速截取需先准备区间，再确认实际起止位置。</small></aside></div>
<footer class="export-footer"><div class="feedback"><div id="status" class="status" role="status">添加视频后选择片段</div><progress id="progress" value="0" max="1"></progress></div><div class="export-actions"><button id="prepare" data-action>准备区间</button><button id="export" data-action class="primary">导出片段</button><button id="cancel" disabled>取消</button></div></footer></main><script type="module" src="tool.js"></script></body></html>
