<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频裁剪</title><link rel="stylesheet" href="base.css"><body>
<main class="clip-app">
<header class="clip-header"><div class="title-group"><span class="tool-icon" aria-hidden="true">▷</span><div><h1>视频裁剪</h1><small id="file-info">选择画面，保留值得留下的片段</small></div></div><div class="header-actions"><button id="settings-toggle" aria-controls="export-settings" aria-expanded="false">导出设置</button><button id="add" class="primary" data-submit>＋ 添加视频</button></div></header>
<div class="video-layout"><section class="stage">
<div class="player card"><video id="player" controls preload="metadata"></video><div id="empty"><strong>添加视频，开始剪辑</strong><span>拖入本地视频，或点击右上角「添加视频」</span><button id="empty-add" class="primary" data-submit>＋ 添加视频</button></div></div>
<section class="clip-selection card" aria-label="片段编辑"><div class="selection-heading"><div class="tabs" role="tablist" aria-label="片段视图"><button id="tab-edit" role="tab" aria-selected="true">裁剪片段</button><button id="tab-list" role="tab" aria-selected="false">片段列表 <span id="clip-count">1</span></button></div><span class="spacer"></span><button id="preview" title="从起点播放，到终点停止">▷ 预览选段</button><label class="loop"><input id="loop" type="checkbox">循环</label><button id="undo" title="撤销 Ctrl+Z">↶</button><button id="redo" title="重做 Ctrl+Shift+Z">↷</button><button id="reset" title="重置为完整视频">重置</button><button id="mark-in" title="当前位置设为起点 · I">设为起点</button><button id="mark-out" title="当前位置设为终点 · O">设为终点</button><details class="editor-more"><summary aria-label="更多编辑操作">⋯</summary><div class="more-menu"><button id="reset-menu">重置选区</button><button id="redo-menu">重做</button><button id="segment-menu">按时长分段</button><label><input id="loop-menu" type="checkbox">循环预览选段</label></div></details></div>
<div id="edit-pane"><div class="zoom-bar"><span class="muted">时间轴</span><button id="zoom-out" title="缩小时间轴">−</button><input id="zoom" type="range" min="1" max="64" step="1" value="1" aria-label="时间轴放大倍数"><button id="zoom-in" title="放大时间轴">＋</button><button id="pan-left" title="向前平移">‹</button><button id="pan-right" title="向后平移">›</button><button id="fit" title="显示完整视频">适应时长</button><span id="current-time">00:00:00.000</span><span class="spacer"></span><button id="refresh-thumbs" data-submit title="读取当前可见区间的16张缩略图">读取缩略图</button></div>
<div id="ticks" class="ticks" aria-hidden="true"></div><div id="trim-track" class="trim-track"><div id="thumbnail-strip" aria-hidden="true"></div><div class="track-base"></div><div class="shade left"></div><div class="shade right"></div><div id="selected-band"></div><input id="in-range" aria-label="裁剪起点" type="range" min="0" max="100" step="0.001" value="0"><input id="out-range" aria-label="裁剪终点" type="range" min="0" max="100" step="0.001" value="100"><button id="playhead" role="slider" aria-label="播放位置" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" title="拖动播放头"></button></div>
<div class="time-fields"><label>起点<input id="start_s" inputmode="decimal" value="00:00:00.000" aria-label="片段起点"></label><label>时长<input id="length_s" inputmode="decimal" value="00:00:00.000" aria-label="片段时长"></label><label>终点<input id="end_s" inputmode="decimal" value="00:00:00.000" aria-label="片段终点"></label><span id="selection-duration" class="duration-chip"></span><span id="duration" hidden></span></div></div>
<div id="list-pane" hidden><div class="list-actions"><button id="add-clip">＋ 保存为新片段</button><button id="split">从播放头分割</button><button id="segment">按时长分段</button></div><div id="clip-list" class="clip-list"></div></div></section>
</section><aside id="export-settings" class="settings" aria-label="导出设置">
<section class="card settings-card"><h2>导出设置</h2><label>方式<span class="mode-switch" role="group" aria-label="裁剪方式"><button id="mode-precise" aria-pressed="true" title="重新编码，按指定起止时间裁剪">精确裁剪</button><button id="mode-fast" aria-pressed="false" title="复制码流，先确认关键帧实际区间">快速截取</button></span><input id="mode" type="hidden" value="精确裁剪"></label><label>画质<select id="quality"><option>较高画质</option><option>均衡</option><option>较小文件</option></select></label><label>尺寸<select id="size"><option>原尺寸</option><option>最长边1920</option><option>最长边1280</option></select></label><label>音轨<select id="audio_index"><option value="-1">自动选择一条音轨</option></select></label><label>格式<select id="format"><option value="mp4">MP4 · 兼容优先</option><option value="mov">MOV</option><option value="gif">GIF · 无音频</option></select></label><label class="check"><input id="remove_audio" type="checkbox">移除音频</label><details class="advanced"><summary>高级设置</summary><label>帧率<select id="fps"><option value="0">与源视频一致</option><option value="10">10 fps</option><option value="12">12 fps</option><option value="15">15 fps</option><option value="24">24 fps</option><option value="25">25 fps</option><option value="30">30 fps</option><option value="50">50 fps</option><option value="60">60 fps</option></select></label><label>码率<input id="bitrate_kbps" type="number" min="0" max="100000" step="100" value="0"></label><small>视频码率 kbps；0 使用画质模式。GIF限30秒、≤15fps、最长边640。</small></details></section>
<section class="card settings-card output-options"><details><summary>输出位置与文件名</summary><label>目录<span class="directory-field"><input id="output_dir" placeholder="源目录 / ModynToolbox Exports"><button id="directory" title="选择输出目录">…</button></span></label><label>文件名<input id="filename" placeholder="自动命名；多片段自动编号"></label></details></section>
<section class="card settings-card"><h2>快捷操作</h2><div class="quick-actions"><button id="snapshot" data-submit>▧ 保存当前帧</button><button id="gif-preset">GIF 设置</button><button id="mute-preset">静音设置</button><button id="queue-history" data-submit>上次队列</button></div><p id="overview" class="overview">添加视频后显示导出概览</p><small id="mode-note">精确裁剪重新编码；原文件只读，同名自动编号。</small></section>
</aside></div>
<footer class="export-footer"><div class="feedback"><div id="status" role="status">就绪</div><progress id="progress" value="0" max="1" hidden></progress></div><button id="show-queue" aria-expanded="false">导出记录 <span id="queue-count">0</span></button><div class="export-actions"><button id="prepare" data-submit hidden>准备区间</button><button id="export" data-submit class="primary">导出片段</button><button id="cancel" disabled>取消</button></div></footer>
<section id="output-panel" class="queue-panel card" hidden><header><h2>导出记录</h2><small id="queue-source"></small><span class="spacer"></span><button id="retry" data-submit hidden>重试未完成</button><button id="close-queue" aria-label="关闭导出记录">×</button></header><div id="queue-list"></div><div id="results" class="scroll"></div></section>
<dialog id="artifact-dialog"><header><h2>输出预览</h2><button id="artifact-close" aria-label="关闭输出预览">×</button></header><video id="artifact-video" controls muted hidden></video><img id="artifact-image" alt="导出结果" hidden><p id="artifact-note"></p></dialog>
<dialog id="segment-dialog"><form method="dialog"><h2>按时长分段</h2><p>替换当前片段列表，可撤销。最后一段保留剩余时长，最多100段。</p><label>每段时长<input id="segment-length" value="00:05:00.000" aria-label="每段时长"></label><div><button value="cancel">取消</button><button id="segment-apply" value="default" class="primary">创建片段</button></div></form></dialog>
</main><script type="module" src="tool.js"></script></body></html>
